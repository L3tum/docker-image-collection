name: Build and Push Docker Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types:
      - published

jobs:
  should-push:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.push_check.outputs.should_push }}
    steps:
      - id: push_check
        run: |
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.action }}" = "published" ]; then
            echo "should_push=true"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds on every push/PR (smoke test); pushes only on release.
  # RELEASE_TAG is the stable "current CUDA" tag (encodes the toolkit, not
  # the repo release), so the runner config can point at a
  # stable: <registry>/<org>/docker-image-collection/cuda-job:cuda-13.4-latest
  publish-cuda-job:
    needs: [should-push]
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@88a5b7b44c7b545af71e3757fdf6bc886ca7cff7 # main
    with:
      DOCKERFILE: "ci/cuda-job.Dockerfile"
      PUSH: ${{ needs.should-push.outputs.should_push }}
      PUSH_LATEST: false
      RELEASE_TAG: "cuda-13.4-latest"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

  # Secondary tag: pins the same image to the repo release version
  # (e.g. release 1.0.0 -> cuda-13.4-1.0.0). Release-only, so it does not
  # add a second build to every push/PR. (This rebuilds the image a second
  # time on release; the shared reusable workflow only tags one tag per run.)
  # NOTE: this job must NOT be gated by an `if` — Forgejo resolves the
  # reusable-workflow `with` inputs of the dependent job even when that job
  # is skipped, so if this job never ran its `secondary_tag` output would be
  # missing and the workflow would fail to evaluate. Keep it always-running
  # (cheap: one echo); the build/push is gated by the job below.
  compute-release-tag:
    needs: [should-push]
    runs-on: ubuntu-latest
    outputs:
      secondary_tag: ${{ steps.calc.outputs.secondary_tag }}
    steps:
      - id: calc
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          # strip a leading "v" so v1.0.0 and 1.0.0 both yield 1.0.0
          ver="${ref#v}"
          echo "secondary_tag=cuda-13.4-${ver}" >> "$GITHUB_OUTPUT"

  publish-cuda-job-release:
    needs: [should-push, compute-release-tag]
    if: needs.should-push.outputs.should_push == 'true'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@88a5b7b44c7b545af71e3757fdf6bc886ca7cff7 # main
    with:
      DOCKERFILE: "ci/cuda-job.Dockerfile"
      PUSH: true
      PUSH_LATEST: false
      RELEASE_TAG: ${{ needs.compute-release-tag.outputs.secondary_tag }}
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
